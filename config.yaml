# ============================================================
# FNTC Baseline Configuration
# This file serves as the persistent default config for training.
# Priority chain: argparse defaults -> config.yaml -> CLI args
# ============================================================

# ---------- quantization configs ----------
qat_noise_schedule: "cosine"
qat_noise_mult_start: 1.0
qat_noise_mult_end: 0.25
qat_noise_warmup_frac: 0.1

# ---------- model configs ----------
output_activation: "hard_swish"
direct_diffuse_infer_mode: "disable"  # disable | rgb | ycocg
normal_encoding: "xy"  # xyz | xy | hemi_oct
mip0_only: true  # true: train, sample, evaluate, and compare Mip0 only
subpixel_sampling_enable: true
subpixel_sampling_ratio: 0.5
subpixel_jitter: 0.5

# ---------- feature grid configs ----------
feature_grid_configs:
  - max_resolution: 1024
    quantize_bits: 8
    save_bits: 32
    learning_rate: 0.0005
 # - max_resolution: 512
 #   quantize_bits: 8
 #   save_bits: 32
 #   learning_rate: 0.001

# ---------- super resolution configs ----------
super_resolution_enable: true
super_resolution_base_resolution: 512

# ---------- tiled positional encoding configs ----------
n_frequencies: 2
pos_encoding_tile_size: 16

# ---------- astc aware configs ----------
astc_aware_enable: true
astc_aware_block: 6
astc_aware_noise_scale: 1.0
astc_aware_start_frac: 0.0
astc_codec_in_loop_enable: true
astc_codec_update_latent: false
astc_codec_in_loop_interval: 100
astc_codec_loss_weight: 0.3
astc_clean_loss_weight: 0.7
# Let the quantized latent settle before adapting the decoder to real ASTC.
astc_codec_start_frac: 0.3
astc_codec_mip0_prob: 1.0
# Clean and ASTC branches use different bases; residual consistency is optional.
astc_consistency_weight: 0.0

# ---------- network configs ----------
n_neurons: 16
n_hidden_layers: 1
learning_rate: 0.002
